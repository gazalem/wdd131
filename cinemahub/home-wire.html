<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CinemaHub Home Wireframe</title>
  <link rel="stylesheet" href="./css/site-plan.css">
  <style>
    /* Additional layout styles for wireframe */
    body {
      background-color: var(--neutral-white);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: var(--primary-color);
      color: white;
      border-radius: 12px;
      margin-bottom: 2rem;
    }

    .header-bar img {
      height: 50px;
    }

    .search-bar input {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: none;
      font-size: 1rem;
      width: 300px;
    }

    .hero {
      background: linear-gradient(135deg, var(--secondary-color), var(--accent1-color));
      color: white;
      padding: 2rem;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 2rem;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin: 1rem 0 2rem;
      justify-content: center;
    }

    .filters button, .filters select {
      background-color: var(--accent2-color);
      color: white;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 6px;
      font-family: var(--heading-font);
      font-weight: 500;
      cursor: pointer;
      transition: background 0.3s;
    }

    .filters button:hover {
      background-color: var(--accent1-color);
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .movie-card {
      background: var(--neutral-light);
      border-radius: 8px;
      padding: 1rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      text-align: center;
      font-family: var(--paragraph-font);
    }

    .movie-card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 0.5rem;
    }

    footer {
      background-color: var(--primary-color);
      color: white;
      text-align: center;
      padding: 2rem;
      border-radius: 12px;
      font-family: var(--paragraph-font);
      margin-top: 2rem;
    }

    @media (max-width: 768px) {
      .search-bar input {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header-bar">
    <img src="logo.svg" alt="CinemaHub Logo">
    <div class="search-bar">
      <input type="text" placeholder="Search movies...">
    </div>
    <nav>
      <a href="#">Home</a>
      <a href="#">Movie Details</a>
      <a href="#">Favorites</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Featured Movie Title</h1>
    <p>Catch the most popular movie of the day, watch trailer and read reviews.</p>
  </section>

  <!-- Filters -->
  <section class="filters">
    <button>Action</button>
    <button>Comedy</button>
    <button>Drama</button>
    <button>Horror</button>
    <button>Sci-Fi</button>
    <select>
      <option>All Ratings</option>
      <option>9+</option>
      <option>8+</option>
      <option>7+</option>
    </select>
  </section>

  <!-- Main Movie Grid -->
  <main class="movie-grid">
    <div class="movie-card">
      <img src="https://via.placeholder.com/200x280" alt="Movie Poster">
      <h3>Movie Title</h3>
      <p>⭐ 8.5</p>
    </div>
    <div class="movie-card">
      <img src="https://via.placeholder.com/200x280" alt="Movie Poster">
      <h3>Movie Title</h3>
      <p>⭐ 7.9</p>
    </div>
    <div class="movie-card">
      <img src="https://via.placeholder.com/200x280" alt="Movie Poster">
      <h3>Movie Title</h3>
      <p>⭐ 9.1</p>
    </div>
    <div class="movie-card">
      <img src="https://via.placeholder.com/200x280" alt="Movie Poster">
      <h3>Movie Title</h3>
      <p>⭐ 8.0</p>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 CinemaHub. All rights reserved.</p>
    <p><a href="#">Privacy Policy</a> | <a href="#">Contact</a></p>
  </footer>

</body>
</html>
