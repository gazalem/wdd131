<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CinemaHub Home Wireframe</title>
  <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css' integrity='sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w==' crossorigin='anonymous'/>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Font Awesome -->
  <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css' integrity='sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==' crossorigin='anonymous'/>
  <!-- Custom Styles -->
  <!-- <link rel="stylesheet" href="./css/site-plan.css"> -->
  <link rel="stylesheet" href="./css/main.css">
  <script src="./js/main.js" type="module"></script>
</head>
<body>

  <!-- Header -->
  <header>
    <img src="./images/logo.svg" alt="Logo" id="site-logo">
    <div class="mobileMenuWrapper">
        <nav class="navigation">
            <a href="#">Home</a>
            <a href="#">Movie Details</a>
            <!-- <a href="#">Favorites</a> -->
        </nav>
        <div class="searchBar">
            <input type="text" name="search" placeholder="Search" class="searchInputBox">
            <button class="searchButton">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
        <i class="hamburgerMenu fa-solid fa-bars"></i>
    </div>
</header>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Featured Movie Title</h1>
    <p>Catch the most popular movie of the day, watch trailer and read reviews.</p>
  </section>

  <!-- Filters -->
  <section class="filters">
    <button>Action</button>
    <button>Comedy</button>
    <button>Drama</button>
    <button>Horror</button>
    <button>Sci-Fi</button>
    <select>
      <option>All Ratings</option>
      <option>9+</option>
      <option>8+</option>
      <option>7+</option>
    </select>
  </section>

  <!-- Main Movie Grid -->
  <main class="movie-grid">
    <!-- Movies will be rendered here by JavaScript -->
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 CinemaHub. All rights reserved.</p>
    <p><a href="#">Privacy Policy</a> | <a href="#">Contact</a></p>
  </footer>

</body>
</html>
