<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="keywords" content="HTML, Form, Checkout, Credit Card">
  <meta name="description" content="Checkout page for credit card payments">
  <meta name="author" content="Alan Montoya">
  <title>Checkout - Credit Card</title>
  <!-- Normalize CSS -->
  <link rel="preload" as="style" href='https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css' integrity='sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w==' crossorigin='anonymous'>
  <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css' integrity='sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w==' crossorigin='anonymous' onload="this.media='all'" >
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&family=Rock+Salt&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="./css/main.css">
  <!-- Scripts -->
  <script src="./js/main.js" defer></script>
</head>
<body>
  <main>
    <form action="">
      <!-- card front -->
      <div class="creditCardFront">
        <div class="bankName">Bank Name</div>
        <div class="creditCardLogo">
          <img src="./img/visa.svg" alt="Credit Card Logo">
        </div>
        <div class="cardNumber">
          <label for="creditCardNumber">Credit Card Number</label>
          <input type="text" id="creditCardNumber" name="creditCardNumber" data-inputmask="'mask': '9999 9999 9999 9999'" pattern="[0-9]{4}[0-9]{4}[0-9]{4}[0-9]{4}" inputmode="numeric" minlength="19" maxlength="19" required>
        </div>
        <div class="cardholderName">
          <label for="cardholderName">Cardholder Name</label>
          <input type="text" id="cardholderName" name="cardholderName" pattern="[A-Za-z\s]{1,}" inputmode="text" placeholder="John Doe" required>
        </div>
        <div class="expirationDate">
          <label for="expirationDate">Exp</label>
          <input type="text" id="expirationDate" name="expirationDate" data-inputmask="'mask': '99/99'" pattern="^(0[1-9]|1[0-2])\/([0-9]{2})$" required>
        </div>
        <div class="cvv">
          <label for="cvv">CVV</label>
          <input type="text" id="cvv" name="cvv" data-inputmask="'mask': '999'" pattern="[0-9]{3}" inputmode="numeric" minlength="3" maxlength="3" required>
        </div>
      </div>
      <!-- card back -->
      <div class="creditCardBack">
        <!-- CVV -->
        <div class="stripe"></div>
        <div class="securityGroup">
          <!-- align the CVV to the right -->
          <div class="signaturebackgrnd"><span id="signature"></span></div>
        </div>
      </div>
      <button type="submit">Pay Now</button>
    </form>
  </main>
</body>
</html>
